<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вечный покой</title>
<style>
:root{--bg:#141317;--panel:#201e26;--panel2:#2a2731;--gold:#c9a84c;--gold-dim:#8a7a4f;--text:#e8e2d5;--dim:#9a917f;--green:#7fae7a;--red:#c96a5a;--blue:#7a9ec9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
#app{display:flex;min-height:100vh}
#side{width:210px;background:var(--panel);border-right:1px solid #35313d;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-size:19px;color:var(--gold);text-align:center;margin-bottom:8px;letter-spacing:1px}
.logo small{display:block;font-size:10px;color:var(--dim);letter-spacing:2px}
.tab{padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:14px;display:flex;justify-content:space-between;align-items:center;user-select:none}
.tab:hover{background:var(--panel2);color:var(--text)}
.tab.active{background:#3a3450;color:var(--gold)}
.badge{background:var(--gold);color:#1a1a1f;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.badge.ok{background:var(--green)}
#sidefoot{margin-top:auto;display:flex;gap:6px}
#sidefoot button{flex:1;background:var(--panel2);border:1px solid #3d3946;color:var(--dim);border-radius:8px;padding:6px;cursor:pointer;font-size:14px}
#main{flex:1;min-width:0}
#top{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 20px;border-bottom:1px solid #35313d;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{background:var(--panel);border:1px solid #3d3946;border-radius:10px;padding:6px 12px;font-size:14px;display:flex;gap:6px;align-items:center;cursor:default}
.chip.off{opacity:.35}
#energybar{width:110px;height:10px;background:#111;border-radius:6px;overflow:hidden;border:1px solid #3d3946}
#energyfill{height:100%;background:var(--gold);transition:width .3s}
.spacer{flex:1}
#newday{background:var(--gold);color:#1a1a1f;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:bold}
#newday:hover{filter:brightness(1.1)}
#content{padding:20px 24px;max-width:1100px}
h2{color:var(--gold);font-size:20px;margin-bottom:4px}
h3{color:var(--gold);font-size:16px;margin:16px 0 8px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px;line-height:1.55;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid #3d3946;border-radius:12px;padding:12px}
.card h4{font-size:15px;margin-bottom:6px}
.card .meta{color:var(--dim);font-size:12px;line-height:1.5;margin-bottom:8px}
.card.occupied{border-color:#5a4a3a}
.btn{background:#3a3450;color:var(--text);border:1px solid #565066;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:inherit;font-size:13px;margin:2px}
.btn:hover:not(:disabled){background:#4a4360}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:#5a4a2a;border-color:var(--gold-dim);color:var(--gold)}
.btn.red{background:#4a2a2a;border-color:#6a3a3a;color:var(--red)}
.btn.green{background:#2a4a2a;border-color:#3a6a3a;color:var(--green)}
.why{color:var(--red);font-size:12px;margin-top:4px}
.flavor{color:var(--dim);font-style:italic;font-size:13px;line-height:1.55;margin:8px 0;max-width:760px}
.deco{font-size:16px;letter-spacing:2px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--gold-dim);padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;animation:tin .3s;max-width:340px;line-height:1.4}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.float{position:fixed;color:var(--gold);font-weight:bold;pointer-events:none;animation:fl 1.1s forwards;z-index:99;font-size:15px}
@keyframes fl{to{transform:translateY(-44px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:14px;padding:24px;max-width:560px;width:92%;max-height:82vh;overflow-y:auto;line-height:1.55}
.modal p{margin:10px 0;font-size:14px}
.modal h3{margin-top:0}
.price{color:var(--gold)}
.trend{font-size:12px}
.up{color:var(--green)}.down{color:var(--red)}
.tech-done{opacity:.55;border-color:var(--green)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:800px){#side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}#app{flex-direction:column}.logo{width:100%}.tab{padding:6px 8px;font-size:12px}#content{padding:14px}}
</style>
</head>

<div id="sidefoot">
<button onclick="toggleSound()" id="sndBtn" title="Звук">🔔</button>
<button onclick="showHelp()" title="Справка">❔</button>
<button onclick="resetGame()" title="Начать заново">↺</button>
</div>
</div>
<div id="main">
<div id="top"></div>
<div id="content"></div>
</div>
</div>

let S=null;
function defaultState(){return{v:5,day:1,coins:40,energy:40,maxEnergy:40,rep:0,science:0,res:{fat:2,thread:2,seeds:2},gravesOpened:6,graves:Array.from({length:20},()=>({level:1,occ:null,deco:{}})),corpses:[],market:{candle:12,wax:7,fertilizer:10,ink:14,skull:30,flesh:4,marble:35,brain:20},techs:{},ach:{},crow:{active:false,order:null,done:0},plant:{owned:false,planted:false,readyDay:0,fert:false},donatedToday:0,rain:false,sound:true,log:[],stats:{buried:0,candlesSold:0,scienceTotal:0,flowers:0,vagrantFed:false,digs:0,extracted:0,waxMade:0,candlesMade:0,sales:0},tut:{on:true},endless:false}}
function save(){try{localStorage.setItem('vp5_save',JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem('vp5_save');if(r){const s=JSON.parse(r);if(s.v===5){S=s;if(S.sound===undefined)S.sound=true;if(!S.marketPrev)S.marketPrev=JSON.parse(JSON.stringify(S.market));if(S.market.brain===undefined)S.market.brain=20;if(!S.tut)S.tut={on:true};['digs','extracted','waxMade','candlesMade','sales'].forEach(k=>{if(S.stats[k]===undefined)S.stats[k]=0});return true}}}catch(e){}return false}
// ================= ПОМОЩНИКИ =================
function have(res){return (S.res[res]||0)}
function addRes(res,n){S.res[res]=(S.res[res]||0)+n;render()}
function spend(res,n){if(have(res)>=n){S.res[res]-=n;return true}return false}
function checkAch(){const t=(id)=>{if(!S.ach[id]){S.ach[id]=true;const a=ACH.find(x=>x.id===id);toast('🏆 Достижение: '+a.n+'!');sfx('ach');log('Получено достижение: '+a.n)}};
if(S.stats.buried>=1)t('a1');if(S.stats.buried>=10)t('a2');if(S.stats.candlesSold>=20)t('a3');if(S.stats.scienceTotal>=50)t('a4');
if(S.graves.filter(g=>g.level===3).length>=5)t('a5');if(S.crow.done>=5)t('a6');if(S.stats.flowers>=20)t('a7');if(S.day>=30)t('a8');if(S.stats.vagrantFed)t('a9');
if(Object.keys(S.techs).length>=TECHS.length)t('a10');if(S.coins>=500)t('a11');if(S.rep>=100)t('a12');}
function log(text){S.log.unshift({day:S.day,text:text});if(S.log.length>120)S.log.pop()}
function toast(msg){const d=document.createElement('div');d.className='toast';d.innerHTML=msg;document.getElementById('toastRoot').appendChild(d);setTimeout(()=>d.remove(),3800)}

function whyNeed(list){const miss=list.filter(x=>{const r=x[0];if(r==='e')return S.energy<x[1];return have(r)<x[1]});if(!miss.length)return null;return 'Не хватает: '+miss.map(m=>m[0]==='e'?ITEMS.energy.i+' '+m[1]+'/'+S.energy:ITEMS[m[0]].i+' '+m[1]+'/'+have(m[0])).join(', ')}
function needCheck(list){const w=whyNeed(list);if(w){return{ok:false,w}}return{ok:true}}

if(t){got=(t.k==='coins'?'монеты обратно':ITEMS[t.k].i+' '+ITEMS[t.k].n+' обратно');if(t.k==='coins')S.coins+=t.n;else addRes(t.k,t.n);window._thief=null}
else{S.coins+=25}
log('Догнал вора в лесу. Вернул добычу и добавил наставлений. Лес запомнил.');toast('Вор пойман: '+got)}else{log('Обшарил весь лес, но следы потерялись в папоротниках. Утро потрачено не зря — почти.');toast('Удача отвернулась')}closeModal();render()}
function forgiveThief(){S.rep+=1;log('Простил вора. Кто-то из деревни видел это и оценил.');toast('Репутация +1');closeModal();render()}
function evInspector(){const bad=S.corpses.filter(c=>c.days>2).length;
if(bad>0){const pen=S.techs.diplomat?2:5;S.rep=Math.max(0,S.rep-pen);showEvent('Инспектор','Инспектор епархии прошёл по кладбищу с блокнотом и тонкой улыбкой. Записал: «'+bad+' тел в состоянии, несовместимом с понятием „покой“». Репутация −'+pen+'. «Разберитесь, — сказал он, — епархия не любит запахов».','Оплеуха')}
else{S.rep+=1;showEvent('Инспектор','Инспектор епархии прошёл по кладбищу с блокнотом. Морг чист, могилы ухожены, свечи ровные. Он поставил галочку и впервые улыбнулся: «Порядок, смотритель. Так держать». Репутация +1.','Комплимент')}}
function evComet(){S.science+=3;S.stats.scienceTotal+=3;showEvent('Комета','Ночью над кладбищем прошла комета. Старожилы говорят: это к знаниям. Ворон смотрел на небо так, будто знал расписание. +3📜.','Знаки')}
function evFind(){addRes('stone',2);showEvent('Старый киот','В дальнем углу кладбища провалился старый киот. Под ним — аккуратно сложенные камни. Дядюшка любил порядок даже в руинах. +2🪨.','Находка')}
function evGustavDeal(){showEvent('Густав с тележкой','Густав привёз тележку жира: «Распродажа, смотритель. Всего 4💰 за штуку, пока не кончилось». Жир — товар деликатный, долго не лежит.','Взять',null,'gustavFatDeal')}
function gustavFatDeal(){if(!spend('coins',12))return;addRes('fat',3);toast('Жир ×3 за 12💰. Выгодно.');closeModal();render()}
function evVolunteers(){showEvent('Волонтёры','Пришли волонтёры с метлами: «Говорят, у вас тут образцовое кладбище будет. Дайте маршрут — и мы нажмём». Убраться силами добрых людей стоит 5 монет на чай.',null,['Угостить (5💰)','volunteerHire'],['Вежливо отказать','closeModal'])}
function volunteerHire(){if(!spend('coins',5))return;S.rep+=1;log('Волонтёры прибрались на кладбище. Чай был горячим, метлы — весёлыми.');toast('Репутация +1');closeModal();render()}
function showEvent(title,text,btnText){
const rest=[].slice.call(arguments,3);
const choices=rest.filter(x=>Array.isArray(x));
const extraFn=rest.find(x=>typeof x==='string'&&x!=='')||null;
let h='<h3>'+title+'</h3><p>'+text+'</p>';
if(choices.length){h+='<div class="row">'+choices.map((c,i)=>'<button class="btn '+(i===0?'gold':'')+'" onclick="'+c[1]+'()">'+c[0]+'</button>').join('')+'</div>'}
else{h+='<button class="btn gold" onclick="closeModal();'+(extraFn?extraFn+'();':'')+'render()">'+(btnText||'Дальше')+'</button>'}
document.getElementById('modalRoot').innerHTML='<div class="modal-bg"><div class="modal">'+h+'</div></div>'}
function victoryCheck(){if(S.rep>=100&&!S.endless){S.endless=true;showVictory();return true}return false}
function newDay(){S.day++;S.rain=false;
S.corpses.forEach(c=>c.days++);
const bad=S.corpses.filter(c=>c.days>2);
if(bad.length){const pen=bad.length;S.rep=Math.max(0,S.rep-pen);log('Тела в морге просрочены: репутация −'+pen+'. Ворон посмотрел строго.')}
if(Math.random()<.6){const stars=1+Math.floor(Math.random()*3+Math.random()*2.5);const st=Math.min(5,Math.max(1,Math.round(stars)));
const cap=S.techs.logistics?2:1;
if(S.corpses.length<cap){S.corpses.push({stars:st,days:0,extracted:0,parts:{skull:true,brain:true,blood:true,fat:true,bones:true,flesh:true}});
log('Ночью привезли постояльца: '+GRAVE_NAMES[Math.floor(Math.random()*GRAVE_NAMES.length)]+' ('+'★'.repeat(st)+'). Повозка скрылась в тумане.')}}
S.marketPrev=JSON.parse(JSON.stringify(S.market));S.market={candle:12+(Math.random()*4-2),wax:7+(Math.random()*2-1),fertilizer:10+(Math.random()*3-1.5),ink:14+(Math.random()*4-2),skull:30+(Math.random()*8-4),flesh:4+(Math.random()-0.5),marble:35+(Math.random()*8-4),brain:20+(Math.random()*4-2)};
if(S.techs.accountant)S.coins+=2*S.graves.filter(g=>g.occ).length;
S.donatedToday=0;
if(S.crow.active&&!S.crow.order&&Math.random()<.4){S.crow.order=CROW_ORDERS[Math.floor(Math.random()*CROW_ORDERS.length)];log('Ворон принёс заказ: «'+S.crow.order.n+'». Птица деловая.')}
S.energy=S.maxEnergy;
checkAch();save();
victoryCheck()
morningEvent();render()}
function showVictory(){document.getElementById('modalRoot').innerHTML='<div class="modal-bg"><div class="modal"><h2>⚖ ОБРАЗЦОВОЕ КЛАДБИЩЕ ⚖</h2><p>Репутация достигла 100. Церковь в восторге, ворон смотрит с уважением, а Густав предложил партнёрство.</p><p>Ты пришёл сюда безвестным наследником с лопатой — а стал человеком, о котором говорят за столами всей епархии. Дядюшка, где бы он ни был, доволен.</p><p>День '+S.day+'. Похоронено: '+S.stats.buried+'. Монет в сундуке: '+fmt(S.coins)+'.</p><button class="btn gold" onclick="closeModal()">Продолжить бессмертие</button></div></div>'}
function showHelp(){document.getElementById('modalRoot').innerHTML='<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><h3>Как играть</h3><p><b>Цель:</b> довести репутацию до 100 и стать образцовым кладбищем.</p><p><b>Цикл:</b> ночью привозят тела — утром вскрывай (ресурсы + качество), хорони с декором, днём копай землю, крафти свечи, торгуй на рынке. Вечером — «Новый день».</p><p><b>Помни:</b> тела гниют после двух дней — инспектор строг. Кости → мука → удобрение → цветы → могилы и бальзам. Мозг → наука или продажа. Череп — из головы постояльца, а не из мозга.</p><p><b>🎒 Сумка</b> — всё твоё добро в одном месте: выпить, изучить, продать.</p><p><b>Прогресс</b> сохраняется сам в браузере.</p><div class="row"><button class="btn gold" onclick="closeModal()">Понял</button><button class="btn" onclick="if(!S.tut)S.tut={on:true};S.tut.on=true;closeModal();render()">Показать обучение</button></div></div></div>'}
function resetGame(){if(!confirm('Начать заново? Прогресс сотрётся.'))return;localStorage.removeItem('vp5_save');S=defaultState();S.sound=true;intro();render()}
function intro(){document.getElementById('modalRoot').innerHTML='<div class="modal-bg"><div class="modal"><h3>Вечный покой</h3><p>Твой дядюшка, смотритель кладбища при маленькой деревне, внезапно ушёл в лучший мир — и по злой иронии оставил тебе не завещание, а территорию с могилами, долгами и лопатой.</p><p>Деревня смотрит косо. Епархия ждёт отчётов. Густав у лавки уже прикидывает, чего новый смотритель захочет купить первым. А ворон на ограде... ворон знает о тебе больше, чем ты о нём.</p><p>Твоя цель — проста и неистребима: сделать кладбище <b>образцовым</b>. Копать, крафтить, торговать, хоронить с достоинством — и однажды услышать, как деревня говорит о тебе с гордостью.</p><button class="btn gold" onclick="closeModal()">Принять наследство</button></div></div>'}
// ================= СТАРТ =================
if(!load()){S=defaultState();S.sound=true;log(LOGOS[Math.floor(Math.random()*LOGOS.length)]);intro()}
else{log('Возвращение на кладбище. День '+S.day+', и всё как оставил.')}
render();
</script>
</body>
</html>
